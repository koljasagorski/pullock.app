name: Pullock
options:
  minimumXcodeGenVersion: 2.45.0
  deploymentTarget:
    macOS: "27.0"
packages:
  PullockCore:
    path: ../../packages/PullockCore
  PullockIPC:
    path: ../../packages/PullockIPC
  PullockUSB:
    path: ../../packages/PullockUSB
  PullockServices:
    path: ../../packages/PullockServices
  PullockActions:
    path: ../../packages/PullockActions
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    ARCHS: arm64
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CURRENT_PROJECT_VERSION: 4
    MARKETING_VERSION: 0.4.1
targets:
  Pullock:
    type: application
    platform: macOS
    sources:
      - PullockApp
      - path: Services/app.pullock.daemon.development.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
      - path: Services/app.pullock.session-agent.development.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    dependencies:
      - package: PullockCore
        product: PullockCore
      - package: PullockCore
        product: PullockSimulation
      - package: PullockIPC
      - package: PullockUSB
      - package: PullockActions
      - package: PullockServices
      - target: PullockDaemon
        link: false
        embed: true
        # Helpers are signed by their own targets with exact XPC identifiers.
        # Re-signing a command-line tool during embedding can replace its ID.
        codeSign: false
        copy:
          destination: wrapper
          subpath: Contents/Library/LaunchServices
      - target: PullockSessionAgent
        link: false
        embed: true
        codeSign: false
        copy:
          destination: wrapper
          subpath: Contents/Library/LaunchServices
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pullock.development
        PRODUCT_NAME: PullockDevelopment
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pullock Development
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 patchletter UG (haftungsbeschränkt)"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  PullockSessionAgent:
    type: tool
    platform: macOS
    sources: [PullockSessionAgent]
    dependencies:
      - package: PullockCore
      - package: PullockIPC
      - package: PullockServices
      - package: PullockActions
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pullock.session-agent.development
        OTHER_CODE_SIGN_FLAGS: "--identifier $(PRODUCT_BUNDLE_IDENTIFIER)"
        SKIP_INSTALL: YES
  PullockDaemon:
    type: tool
    platform: macOS
    sources: [PullockDaemon]
    dependencies:
      - package: PullockCore
      - package: PullockIPC
      - package: PullockServices
        product: PullockDaemonRuntime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pullock.daemon.development
        OTHER_CODE_SIGN_FLAGS: "--identifier $(PRODUCT_BUNDLE_IDENTIFIER)"
        SKIP_INSTALL: YES
schemes:
  PullockDevelopment:
    build:
      targets:
        Pullock: all
        PullockSessionAgent: all
        PullockDaemon: all
    run:
      config: Debug
      executable: Pullock
    archive:
      config: Release
