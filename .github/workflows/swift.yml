name: Native development checks

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "apps/macos/**"
      - "tools/**"
      - ".github/workflows/swift.yml"
  pull_request:
    paths:
      - "packages/**"
      - "apps/macos/**"
      - "tools/**"
      - ".github/workflows/swift.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Test packages and build safe development executables
        run: bash tools/validation/check.sh
